name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  statuses: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  PRODUCTION_URL: https://tripflow-liart.vercel.app

jobs:
  quality:
    name: Quality gate
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Verify Vercel production deploy
    if: github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      # Vercel's Git Integration deploys every main commit. Wait for that
      # commit-specific status before testing the production alias.
      - name: Wait for Vercel Git deployment
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          deadline=$((SECONDS + 900))
          while (( SECONDS < deadline )); do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status" --jq '[.statuses[] | select(.context == "Vercel")][0].state // ""')"
            vercel_url="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status" --jq '[.statuses[] | select(.context == "Vercel")][0].target_url // ""')"

            case "$status" in
              success)
                echo "Vercel Git deployment succeeded: $vercel_url"
                echo "url=$PRODUCTION_URL" >> "$GITHUB_OUTPUT"
                echo "vercel_url=$vercel_url" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              failure|error)
                echo "Vercel Git deployment failed: $vercel_url" >&2
                exit 1
                ;;
            esac

            echo "Waiting for Vercel Git deployment (state=${status:-pending})"
            sleep 15
          done

          echo "Timed out waiting for the Vercel Git deployment." >&2
          exit 1
      - name: Smoke test production alias
        run: |
          for path in / /ledger /explore /privacy /support; do
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors --max-time 30 "$PRODUCTION_URL$path" > /dev/null
          done
      - name: Deployment summary
        if: success()
        run: |
          {
            echo "### Production deployment"
            echo "- Production alias: $PRODUCTION_URL"
            echo "- Vercel deployment: ${{ steps.deploy.outputs.vercel_url }}"
            echo "- Commit: $GITHUB_SHA"
            echo "- Smoke tests: passed (/, /ledger, /explore, /privacy, /support)"
          } >> "$GITHUB_STEP_SUMMARY"
