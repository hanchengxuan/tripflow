name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check formatting boundaries
        run: git diff --check
      - name: Lint
        run: npm run lint -- --no-cache
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --ci --watchman=false
      - name: Dependency audit
        shell: bash
        run: |
          audit_file="$(mktemp)"
          trap 'rm -f "$audit_file"' EXIT
          npm audit --omit=dev --audit-level=high --json > "$audit_file" || true
          node scripts/check-npm-audit.mjs "$audit_file"
      - name: Build web export
        run: npm run build:web
      - name: Verify web artifact
        run: test -s dist/index.html
