name: CI

# No `push` trigger for main. `deploy-production.yml` already calls this
# workflow, so a push trigger here ran the same four jobs a second time on
# every merge — roughly a third of this repository's Actions minutes.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check formatting boundaries
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test -n "$PR_BASE_SHA"
            test -n "$PR_HEAD_SHA"
            git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
          elif [ -n "$PUSH_BASE_SHA" ] && [ "$PUSH_BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$PUSH_BASE_SHA" "$HEAD_SHA"
          else
            git diff --check HEAD^ HEAD
          fi
      - name: Lint
        run: npm run lint -- --no-cache
      - name: Typecheck
        run: npm run typecheck
      - name: Dependency audit
        shell: bash
        run: |
          audit_file="$(mktemp)"
          trap 'rm -f "$audit_file"' EXIT
          set +e
          npm audit --omit=dev --audit-level=high --json > "$audit_file"
          audit_status=$?
          set -e
          if [ "$audit_status" -gt 1 ]; then
            echo "npm audit could not complete (exit $audit_status)." >&2
            cat "$audit_file" >&2 || true
            exit "$audit_status"
          fi
          node scripts/check-npm-audit.mjs "$audit_file"

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --ci --watchman=false

  build:
    name: Expo health and exports
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Expo Doctor
        run: npm run doctor
      - name: Build web export
        run: npm run build:web
      - name: Verify web artifact
        run: test -s dist/index.html
      - name: Build iOS export
        run: npm run build:ios
      - name: Verify iOS artifact
        run: test -n "$(find .expo-exports/ios -type f \( -name '*.hbc' -o -name '*.js' \) -print -quit)"

  e2e:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npm run test:e2e
      - name: Upload Playwright evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  validate:
    name: validate
    if: always()
    needs: [static, unit, build, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI gate
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          for result in "$STATIC_RESULT" "$UNIT_RESULT" "$BUILD_RESULT" "$E2E_RESULT"; do
            test "$result" = success
          done
