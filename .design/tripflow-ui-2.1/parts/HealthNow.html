<div class="screen tagged" style="height:660px">
  <div class="tag tag-now">现状 · Itinerary health on Today</div>
  <div class="scroll" style="gap:14px">

    <!-- Card border, then a border on every issue inside it. -->
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:16px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:16px">
        <div style="flex:1;display:flex;flex-direction:column;gap:8px">
          <div style="font-size:14px;line-height:20px;font-weight:700">发现行程问题</div>
          <div style="font-size:14px;line-height:20px;font-weight:500;color:var(--text2)">检测到冲突或衔接问题，可直接修改安排。</div>
        </div>
        <div class="btn btn-s" style="min-height:48px;white-space:nowrap">重新检查</div>
      </div>

      <div style="display:flex;flex-direction:column;gap:12px">
        <div style="font-size:14px;line-height:20px;font-weight:700">发现 2 处需要确认的问题。</div>

        <div style="border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
            <div style="display:flex;align-items:center;gap:8px">
              <div style="width:8px;height:8px;border-radius:4px;background:var(--danger)"></div>
              <div style="font-size:14px;line-height:20px;font-weight:700">时间重叠</div>
            </div>
            <div style="font-size:14px;line-height:20px;font-weight:500;color:var(--danger)">需要处理</div>
          </div>
          <div style="font-size:14px;line-height:20px;font-weight:700">龍吟 晚餐 与 teamLab Planets 重叠</div>
          <div style="font-size:14px;line-height:20px;font-weight:500;color:var(--text2)">两项安排都落在 19:00 — 21:00，无法同时到场。</div>
          <div style="font-size:14px;line-height:20px;font-weight:500;color:var(--info)">要把哪一项往后挪？</div>
          <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:8px">
            <div class="link" style="min-height:44px;display:flex;align-items:center">修改“龍吟 晚餐”</div>
            <div class="link" style="min-height:44px;display:flex;align-items:center">修改“teamLab Planets”</div>
          </div>
        </div>

        <div style="border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
            <div style="display:flex;align-items:center;gap:8px">
              <div style="width:8px;height:8px;border-radius:4px;background:var(--plan)"></div>
              <div style="font-size:14px;line-height:20px;font-weight:700">衔接较紧</div>
            </div>
            <div style="font-size:14px;line-height:20px;font-weight:500;color:var(--plan)">建议查看</div>
          </div>
          <div style="font-size:14px;line-height:20px;font-weight:700">取 JR Pass 后只剩 15 分钟</div>
          <div style="font-size:14px;line-height:20px;font-weight:500;color:var(--text2)">东京站到丰洲的车程约 28 分钟。</div>
          <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:8px">
            <div class="link" style="min-height:44px;display:flex;align-items:center">修改“取 JR Pass”</div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
