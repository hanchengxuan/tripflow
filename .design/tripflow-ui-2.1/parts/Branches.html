<div class="screen tagged" style="height:660px">
  <div class="tag tag-new">提案 · Branch management, off the timeline</div>
  <div style="padding:44px 0 0">
    <div style="background:var(--surface);border-radius:20px 20px 0 0;margin:8px 0 0;padding:16px 20px 24px;display:flex;flex-direction:column;gap:16px">
      <div style="width:36px;height:4px;border-radius:2px;background:var(--border);align-self:center"></div>

      <div class="sec">
        <div class="sec-row"><div class="sec-t">分支</div></div>
        <div class="sec-d">一段时间内只有部分同行者参与。账本仍是整个行程一本。</div>
      </div>

      <div style="background:var(--subtle);border-radius:16px;padding:2px 16px">
        <div class="lrow">
          <div style="display:flex;flex:none">
            <div style="width:28px;height:28px;border-radius:14px;background:var(--accentSoft);color:var(--accentOnSoft);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid var(--subtle)">陈</div>
            <div style="width:28px;height:28px;border-radius:14px;background:var(--kLodgingS);color:var(--kLodging);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid var(--subtle);margin-left:-8px">李</div>
          </div>
          <div class="copy">
            <div class="l-t">后半段</div>
            <div class="l-s">3月12 — 3月16 · 2 位同行者 · 6 项安排</div>
          </div>
          <svg width="8" height="14" viewBox="0 0 8 14" fill="none" aria-hidden="true" style="flex:none">
            <path d="m1.4 1.4 5.2 5.6-5.2 5.6" stroke="#8A9491" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="divider"></div>
        <div class="lrow">
          <div style="display:flex;flex:none">
            <div style="width:28px;height:28px;border-radius:14px;background:var(--kFoodS);color:var(--kFood);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid var(--subtle)">周</div>
          </div>
          <div class="copy">
            <div class="l-t">箱根一日</div>
            <div class="l-s">3月14 — 3月14 · 1 位同行者 · 3 项安排</div>
          </div>
          <svg width="8" height="14" viewBox="0 0 8 14" fill="none" aria-hidden="true" style="flex:none">
            <path d="m1.4 1.4 5.2 5.6-5.2 5.6" stroke="#8A9491" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <div class="divider" style="margin:2px 0"></div>

      <!-- Dissolve moved out of the row's trailing edge: a consequence stated once,
           then a danger action. Nothing shifts under the reader's thumb. -->
      <div style="display:flex;flex-direction:column;gap:12px">
        <div style="font-size:14px;line-height:20px;font-weight:700">解散「后半段」</div>
        <div class="notice" style="background:var(--dangerSoft)">
          <div class="bar" style="background:var(--danger)"></div>
          <p style="color:var(--danger)">这 6 项安排会回到整个行程，所有人都能看到。安排本身不会被删除。</p>
        </div>
        <div class="btn" style="background:var(--danger);color:var(--onAccent)">解散分支</div>
      </div>

    </div>
  </div>
</div>
