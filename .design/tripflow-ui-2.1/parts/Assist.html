<div class="screen tagged" style="height:760px">
  <div class="tag tag-new">提案 · One step, one primary action</div>
  <div style="padding:44px 0 0">
    <div style="background:var(--surface);border-radius:20px 20px 0 0;margin:8px 0 0;padding:16px 20px 24px;display:flex;flex-direction:column;gap:16px">
      <div style="width:36px;height:4px;border-radius:2px;background:var(--border);align-self:center"></div>
      <div style="font-size:20px;line-height:26px;font-weight:600;letter-spacing:-0.2px">编辑安排</div>

      <!-- Collapsed: one line, no container, no accent rule. -->
      <div style="min-height:44px;display:flex;align-items:center;gap:8px">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M6.6 2.4 7.5 5l2.6.9-2.6.9-.9 2.6-.9-2.6L3.1 5.9 5.7 5l.9-2.6Z" stroke="#2E6A96" stroke-width="1.3" stroke-linejoin="round"/>
          <path d="m12.4 8.2.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7.7-2Z" stroke="#2E6A96" stroke-width="1.3" stroke-linejoin="round"/>
        </svg>
        <span class="link">智能调整这项安排</span>
      </div>

      <div class="divider"></div>

      <!-- Expanded, preview state. Plain tonal block; the accent rule is gone. -->
      <div style="background:var(--subtle);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px">
          <div style="flex:1;min-width:0;font-size:14px;line-height:20px;font-weight:700">智能调整 · 龍吟 晚餐</div>
          <div class="link" style="min-height:44px;display:flex;align-items:center">关闭</div>
        </div>

        <div style="display:flex;flex-direction:column;gap:6px">
          <div class="f-label">想怎么改？</div>
          <div class="input" style="min-height:66px;align-items:flex-start;padding-top:12px;color:var(--text)">改到 teamLab 结束之后</div>
        </div>

        <div style="display:flex;flex-direction:column;gap:10px">
          <div style="font-size:14px;line-height:20px;font-weight:700">修改预览</div>
          <div style="font-size:13px;line-height:19px;font-weight:500;color:var(--text2)">把晚餐移到 teamLab 之后，避开重叠。</div>

          <!-- The diff label column sits on the rail gutter, 46px, like everything else. -->
          <div style="display:flex;gap:12px;align-items:flex-start">
            <div style="width:46px;flex:none;font-size:13px;line-height:19px;font-weight:700;color:var(--text2)">时间</div>
            <div style="flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px">
              <span style="font-size:13px;line-height:19px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums">3月10日 19:00 — 21:00</span>
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true" style="flex:none">
                <path d="M1.5 6h9m-3.4-3.4L10.5 6 7.1 9.4" stroke="#0E6E57" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span style="font-size:13px;line-height:19px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums">3月10日 21:30 — 23:00</span>
            </div>
          </div>
          <div style="display:flex;gap:12px;align-items:flex-start">
            <div style="width:46px;flex:none;font-size:13px;line-height:19px;font-weight:700;color:var(--text2)">名称</div>
            <div style="flex:1;min-width:0;font-size:13px;line-height:19px;font-weight:500;color:var(--muted)">未改动</div>
          </div>
        </div>

        <!-- Exactly one primary. Before a preview exists it reads 生成预览; once one
             arrives it becomes 应用修改 and 重新生成 drops to a link. -->
        <div class="btn btn-p">应用修改</div>
        <div style="display:flex;align-items:center;justify-content:center;gap:20px">
          <span class="link">重新生成</span>
          <span class="link">放弃预览</span>
        </div>
        <div style="font-size:12px;line-height:17px;font-weight:500;color:var(--muted);text-align:center">确认后才会保存，随时可以撤回。</div>
      </div>
    </div>
  </div>
</div>
