<!-- @dsCard group="Screens" -->
<title>TripFlow · Dark</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="kit.css">
<style>body { background: #0B100F; } .frame > figcaption { color: #9EAAA7; } .frame > figcaption span { color: #7C8885; }</style>

<div class="gallery">

  <!-- ============ TODAY · DARK ============ -->
  <figure class="frame">
    <div class="phone theme-dark">
      <div class="status"><span>9:41</span><span class="dots"><i></i><i></i><b></b></span></div>

      <div class="scr">
        <div class="hdr">
          <h1>香港五日</h1>
          <div class="ctx">
            <span>3月12 — 3月16</span><span class="sep"></span>
            <span><b>4</b> 人同行</span><span class="sep"></span><span>HK$ 本位币</span>
          </div>
        </div>

        <div class="hero">
          <div class="eyebrow">
            <span class="pill solid k-transport">交通 Transport</span>
            <em>下一步 Up next</em>
          </div>
          <h2>机场快线 → 中环</h2>
          <div class="meta">
            <div><span>时间 When</span><strong>09:20 — 09:44</strong></div>
            <div><span>同行 Who</span><strong>4 人可见</strong></div>
          </div>
          <div class="placebtn">
            <div><strong>香港国际机场 T1</strong><small>打开地图 Open map</small></div>
            <span class="chev"></span>
          </div>
        </div>

        <div class="sect"><h2>住宿 Stays</h2><span>1 段</span></div>
        <div class="stay">
          <span class="bar"></span>
          <div class="copy">
            <strong>半岛酒店 The Peninsula</strong>
            <span>3月12日 15:00 — 3月15日 11:00</span>
            <small>尖沙咀梳士巴利道</small>
          </div>
          <div class="nights"><b>3</b><span>晚 nights</span></div>
        </div>

        <div class="sect"><h2>后续安排 Later</h2><span>5</span></div>
        <div class="rail">
          <div class="railseg">
            <div class="gutter"></div><div class="spine"><span class="line"></span></div>
            <div class="body">
              <span class="estimate"><b>公共交通</b><i></i>3.2 km · 约 18 分钟</span>
              <span class="maplink">地图 Map</span>
            </div>
          </div>
          <div class="railrow">
            <div class="gutter"><b>15:00</b><span>16:00</span></div>
            <div class="spine"><span class="dot" style="background:var(--kind-lodging)"></span><span class="line"></span></div>
            <div class="body">
              <div class="head"><h3>入住半岛酒店</h3><span class="pill k-lodging"><i></i>住宿</span></div>
              <div class="place">尖沙咀梳士巴利道</div>
            </div>
          </div>
          <div class="railrow">
            <div class="gutter"><b>18:30</b><span>20:00</span></div>
            <div class="spine"><span class="dot" style="background:var(--kind-food)"></span><span class="line"></span></div>
            <div class="body">
              <div class="head"><h3>添好运 点心晚餐</h3><span class="pill k-food"><i></i>餐饮</span></div>
              <div class="place">深水埗福荣街 9-11 号</div>
            </div>
          </div>
        </div>
      </div>

      <div class="fab"></div>
      <nav class="nav"><a class="on">今天</a><a>行程</a><a>账本</a><a>我的</a></nav>
    </div>
    <figcaption>Today — 深色
      <span>近黑带极淡绿灰，而非海军蓝：松绿仍是画面里唯一的色相</span>
    </figcaption>
  </figure>

  <!-- ============ LEDGER · DARK ============ -->
  <figure class="frame">
    <div class="phone theme-dark">
      <div class="status"><span>9:41</span><span class="dots"><i></i><i></i><b></b></span></div>

      <div class="scr">
        <div class="hdr">
          <h1>账本</h1>
          <div class="ctx"><span>香港五日</span><span class="sep"></span><span>本位币 HK$</span><span class="sep"></span><span>12 笔支出</span></div>
        </div>

        <div class="segmented"><div class="on">结算 Settle</div><div>明细 Activity</div></div>

        <div class="balance">
          <div class="legend">
            <div class="out"><span>你要付 To send</span><strong>HK$ 412.50</strong></div>
            <div class="in"><span>该收 To receive</span><strong>HK$ 268.00</strong></div>
          </div>
          <div class="track">
            <span class="fill out" style="left:52px;width:118px"></span>
            <span class="fill in" style="left:170px;width:77px"></span>
            <span class="zero" style="left:169px"></span>
          </div>
          <div class="net">净额 Net <b>−HK$ 144.50</b> · 2 笔待转出 · 1 笔待收</div>
        </div>

        <div class="sect"><h2>我的待办</h2><span>2</span></div>
        <div class="stack">
          <div class="task">
            <span class="avatar">小王</span>
            <div class="copy"><strong>转给 小王</strong><small>用其他币种付款</small></div>
            <div class="right"><span class="amt">HK$ 286.50</span><button class="btn btn-sm btn-primary">标记已转账</button></div>
          </div>
          <div class="task">
            <span class="avatar">Ana</span>
            <div class="copy"><strong>转给 Ana</strong><small>用其他币种付款</small></div>
            <div class="right"><span class="amt">HK$ 126.00</span><button class="btn btn-sm btn-primary">标记已转账</button></div>
          </div>
        </div>

        <div class="rowlist">
          <div class="listrow"><div class="copy"><strong>已完成</strong><span>3 笔 · 含 1 笔已收入</span></div><span class="chev"></span></div>
          <div class="hr"></div>
          <div class="listrow"><div class="copy"><strong>全员结算</strong><span>查看 4 人的待转 / 已转状态</span></div><span class="chev"></span></div>
        </div>
      </div>

      <div class="fab"></div>
      <nav class="nav"><a>今天</a><a>行程</a><a class="on">账本</a><a>我的</a></nav>
    </div>
    <figcaption>Ledger — 深色
      <span>money/out 在暗色下提亮为陶土色，仍与 danger 红分得开</span>
    </figcaption>
  </figure>

</div>
