<div class="screen tagged" style="height:720px">
  <div class="tag tag-new">提案 · 换币种 = 整本账重新计价</div>
  <div style="position:absolute;inset:28px 0 0;background:rgba(12,25,36,0.32)"></div>
  <div class="sheet" style="top:56px;bottom:0;overflow:hidden">
    <div class="grab"></div>
    <div class="sheet-h"><h2>记账币种</h2><div class="l-t" style="color:var(--text2)">取消</div></div>
    <div class="sheet-body" style="gap:14px">

      <!-- Said first, because the earlier copy implied the opposite. -->
      <div class="l-s" style="font-size:14px;line-height:20px">
        支出可以用任何币种记录 —— 记一笔时选币种就行，付了多少就存多少。这里设的只是汇总和结算用的单位。</div>

      <div class="list" style="background:var(--subtle)">
        <div class="srow"><div class="lab">当前记账币种</div><div class="val">CNY</div></div>
        <div class="hair"></div>
        <div class="srow"><div class="lab">已记录支出</div><div class="val">12 笔 · 3 种币种</div></div>
      </div>

      <div style="display:flex;flex-direction:column;gap:6px">
        <div class="f-label">记账币种</div><div class="input" style="color:var(--text)">JPY · 日元</div></div>

      <!-- One rate per currency actually spent. What was paid never changes. -->
      <div class="l-s">这 12 笔支出会按下面的汇率重新计价。付出去的金额不变，只是换个单位来汇总。</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div class="f-label">1 CNY = ? JPY</div><div class="input" style="color:var(--text)">20.4</div></div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div class="f-label">1 EUR = ? JPY</div><div class="input" style="color:var(--text)">159.2</div></div>

      <div class="btn btn-p">换算并保存</div>
    </div>
  </div>
</div>
