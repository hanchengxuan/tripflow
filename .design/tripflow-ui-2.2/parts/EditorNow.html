           open there is no way to save the edits already typed above.

           (4) Cancel and the destructive action sit side by side at equal
           weight; HIG separates them and puts Cancel last. -->
      <div style="border-top:1px solid var(--selected);padding-top:14px;display:flex;flex-direction:column;gap:10px">
        <div class="l-t">删除「伏见稻荷大社」？</div>
